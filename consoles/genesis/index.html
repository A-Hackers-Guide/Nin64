<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genesis — Nin64</title>
<link rel="stylesheet" href="gen.css">
</head>
<body>
<div id="boot" class="boot">
  <div>
    <div class="plate">GENESIS</div>
    <div class="sub">16-BIT · LOCAL</div>
  </div>
</div>

<div id="menu" class="menu">
  <div class="title">Genesis Library</div>
  <div class="carts" id="carts"></div>
  <div class="actions">
    <button class="btn" id="library-btn">Library</button>
    <button class="btn" id="settings-btn">Options</button>
    <button class="btn" id="home-btn">Exit</button>
  </div>
</div>

<div id="library-modal" class="modal">
  <div class="sheet">
    <h2>Library</h2>
    <p class="lead">Add .gen / .md / .smd files — stored locally.</p>
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <button class="btn" id="lib-add">Add ROM</button>
      <input type="file" id="lib-input" multiple accept=".gen,.md,.smd" hidden>
      <button class="btn" data-close>Back</button>
    </div>
    <div id="lib-list"></div>
  </div>
</div>

<div id="settings-modal" class="modal">
  <div class="sheet">
    <h2>Options</h2>
    <p class="lead">Nin64 Genesis 1.0</p>
    <div class="setrow"><span>Name</span><input type="text" id="gen-user"></div>
    <div class="setrow"><span>Sound</span><div class="toggle on" id="gen-sound"></div></div>
    <div style="display:flex;gap:10px;margin-top:20px;justify-content:space-between">
      <button class="btn" id="gen-export">Export this console as HTML</button>
      <button class="btn" data-close>Back</button>
    </div>
  </div>
</div>

<div class="emu-mount" id="emu-mount"></div>
<button class="emu-close" id="emu-close" style="display:none">Stop</button>
<script type="module" src="gen.js"></script>
</body>
</html>
